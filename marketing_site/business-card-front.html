<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PI Prop Intelligence Business Card - Front</title>
  <style>
    @page{size:3.75in 2.25in;margin:0}
    *{box-sizing:border-box}
    html,body{width:3.75in;height:2.25in;margin:0;overflow:hidden}
    body{color:#f5f7f8;font-family:Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .card{position:relative;width:3.75in;height:2.25in;overflow:hidden;padding:.28in .34in;background:radial-gradient(circle at 12% 12%,#123b4d 0,transparent 40%),linear-gradient(135deg,#02090d,#071722 72%,#02090d);border:.02in solid #b69a4b;display:flex;align-items:center;gap:.13in}
    .card:after{content:"";position:absolute;inset:.08in;border:1px solid #384b56;pointer-events:none}
    .card>div{min-width:0;flex:1}
    .logo{width:.82in;height:.82in;flex:0 0 .82in;object-fit:contain;filter:drop-shadow(0 8px 14px #000)}
    .eyebrow{color:#c7ad61;font-size:6.4pt;font-weight:900;letter-spacing:1.05px;white-space:normal}
    h1{font-size:15pt;line-height:1;margin:.065in 0;color:#fff}
    p{margin:0;color:#b7c0c5;font-size:6.35pt;line-height:1.32;overflow-wrap:anywhere}
    .loop{max-width:100%;margin-top:.085in;color:#d7bd68;font-size:5.9pt;font-weight:900;line-height:1.2;letter-spacing:.3px;white-space:normal;overflow-wrap:anywhere}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/pi-logo.png" alt="PI logo">
    <div>
      <div class="eyebrow">PI PROP INTELLIGENCE</div>
      <h1>INTELLIGENCE<br>THAT LEARNS.</h1>
      <p>Adaptive multi-sport prop research powered by verified outcomes and guarded model calibration.</p>
      <div class="loop">PREDICT · GRADE · LEARN · IMPROVE</div>
    </div>
  </main>
</body>
</html>
