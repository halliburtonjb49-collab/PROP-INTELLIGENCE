services:
  - type: web
    name: prop-intelligence-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python python_backend/scripts/apply_supabase_migrations.py
    startCommand: uvicorn main:app --app-dir python_backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    maxShutdownDelaySeconds: 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSLMODE
        value: require
      - key: DATABASE_POOL_SIZE
        value: 5
      - key: SLOW_QUERY_MS
        value: 250
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: prop-intelligence-redis
          property: connectionString
      - key: ODDS_API_KEY
        sync: false
      - key: ODDS_API_KEY_SECONDARY
        sync: false
      - key: API_SPORTS_KEY
        sync: false
      - key: SPORTMONKS_API_KEY
        sync: false
      - key: API_SPORTS_BASEBALL_KEY
        sync: false
      - key: SPORTMONKS_HEADSHOT_MAP_PATH
        value: /tmp/sportmonks_headshot_map.json
      - key: ESPN_HEADSHOT_MAP_PATH
        value: /tmp/espn_headshot_map.json
      - key: SPORTSDATAIO_API_KEY
        sync: false
      - key: CRICKETDATA_API_KEY
        sync: false
      - key: SPORTMONKS_CRICKET_API_KEY
        sync: false
      - key: BALLDONTLIE_API_KEY
        sync: false
      - key: SPORTRADAR_WNBA_API_KEY
        sync: false
      - key: SPORTRADAR_API_KEY
        sync: false
      - key: SPORTRADAR_ACCESS_LEVEL
        value: trial
      - key: SPORTSGAMEODDS_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: REVENUECAT_WEBHOOK_SECRET
        sync: false
      - key: REVENUECAT_CORE_PRODUCT_IDS
        sync: false
      - key: REVENUECAT_EDGE_PRODUCT_IDS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: REVENUECAT_PUBLIC_API_KEY
        sync: false
      - key: WNBA_LEAGUE_ID
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://app.propsintell.com,https://www.propsintell.com,https://propsintell.com
      - key: SLIP_DATABASE_PATH
        value: /tmp/prop_intelligence_tickets.db
      - key: SLIP_STORAGE_BACKEND
        value: postgres
      - key: PROP_CACHE_DB_PATH
        value: /tmp/prop_intelligence_cache.db
      - key: LIVE_ODDS_SYNC_MIN_SECONDS
        value: 120
      - key: PROP_SYNC_EVENT_WORKERS
        value: 6
      - key: ODDS_FAST_REFRESH_SECONDS
        value: 120
      - key: ODDS_SUPPLEMENTAL_REFRESH_SECONDS
        value: 300
      - key: ODDS_COVERAGE_REFRESH_SECONDS
        value: 1800
      - key: SPORTSGAMEODDS_LEAGUES_PER_SYNC
        value: 11
      - key: SPORTSGAMEODDS_DISABLED_LEAGUES
        value: ""
      - key: RAW_PROP_STREAM
        value: prop-intelligence:raw-feeds
      - key: RAW_PROP_STREAM_MAXLEN
        value: 5000
      - key: ANONYMOUS_REQUESTS_PER_MINUTE
        value: 20
      - key: AUTHENTICATED_REQUESTS_PER_MINUTE
        value: 120
      - key: PROP_COVERAGE_SYNC_SECONDS
        value: 1800
      - key: EMPTY_PROP_SYNC_ATTEMPTS
        value: 3
      - key: EMPTY_PROP_SYNC_RETRY_SECONDS
        value: 300
      - key: PROP_FEED_STALE_MINUTES
        value: 180
      - key: PROP_FEED_WATCHDOG_SECONDS
        value: 300
      - key: ODDS_API_LOW_QUOTA_THRESHOLD
        value: 100
      - key: ODDS_API_QUOTA_RESERVE
        value: 25
      - key: ODDS_REGIONS
        value: us,us2,us_dfs
      - key: PREFERRED_BOOKMAKERS
        value: prizepicks,underdog,draftkings,sleeper,fanduel,betr_us_dfs
      - key: PROP_SYNC_SPORTS
        value: baseball_mlb,basketball_wnba,basketball_nba,americanfootball_nfl,icehockey_nhl,soccer_epl,soccer_usa_mls,soccer_france_ligue_one,soccer_germany_bundesliga,soccer_italy_serie_a,soccer_spain_la_liga,aussierules_afl,rugbyleague_nrl
      - key: ADMIN_API_KEY
        sync: false
      - key: OWNER_EMAILS
        value: halliburtonjb49@gmail.com
      - key: OWNER_USER_IDS
        value: 84a76503-f704-46b6-be87-760ea8c9f2f5
      - key: PIPELINE_ALERT_WEBHOOK_URL
        sync: false
      - key: HISTORICAL_MLB_LOOKBACK_DAYS
        value: 21
  - type: keyvalue
    name: prop-intelligence-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: worker
    name: prop-intelligence-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: cd python_backend && rq worker --url $REDIS_URL prop-intelligence
    maxShutdownDelaySeconds: 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: prop-intelligence-redis
          property: connectionString
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSLMODE
        value: require
      - key: ODDS_API_KEY
        sync: false
      - key: ODDS_API_KEY_SECONDARY
        sync: false
      - key: API_SPORTS_KEY
        sync: false
      - key: SPORTMONKS_API_KEY
        sync: false
      - key: API_SPORTS_BASEBALL_KEY
        sync: false
      - key: SPORTSDATAIO_API_KEY
        sync: false
      - key: CRICKETDATA_API_KEY
        sync: false
      - key: SPORTMONKS_CRICKET_API_KEY
        sync: false
      - key: BALLDONTLIE_API_KEY
        sync: false
      - key: SPORTRADAR_WNBA_API_KEY
        sync: false
      - key: SPORTRADAR_API_KEY
        sync: false
      - key: SPORTRADAR_ACCESS_LEVEL
        value: trial
      - key: SPORTSGAMEODDS_API_KEY
        sync: false
      - key: SLIP_DATABASE_PATH
        value: /tmp/prop_intelligence_tickets.db
      - key: PROP_CACHE_DB_PATH
        value: /tmp/prop_intelligence_cache.db
      - key: PROP_SYNC_EVENT_WORKERS
        value: 6
      - key: ODDS_FAST_REFRESH_SECONDS
        value: 120
      - key: ODDS_SUPPLEMENTAL_REFRESH_SECONDS
        value: 300
      - key: ODDS_COVERAGE_REFRESH_SECONDS
        value: 1800
      - key: SPORTSGAMEODDS_LEAGUES_PER_SYNC
        value: 11
      - key: SPORTSGAMEODDS_DISABLED_LEAGUES
        value: ""
      - key: RAW_PROP_STREAM
        value: prop-intelligence:raw-feeds
      - key: RAW_PROP_STREAM_MAXLEN
        value: 5000
      - key: PREFERRED_BOOKMAKERS
        value: prizepicks,underdog,draftkings,sleeper,fanduel,betr_us_dfs
      - key: ODDS_REGIONS
        value: us,us2,us_dfs
      - key: PROP_SYNC_SPORTS
        value: baseball_mlb,basketball_wnba,basketball_nba,americanfootball_nfl,icehockey_nhl,soccer_epl,soccer_usa_mls,soccer_france_ligue_one,soccer_germany_bundesliga,soccer_italy_serie_a,soccer_spain_la_liga,aussierules_afl,rugbyleague_nrl

  - type: cron
    name: prop-intelligence-historical-sync
    runtime: python
    schedule: "0 8 * * *"
    buildCommand: pip install -r requirements.txt -r requirements-historical.txt
    startCommand: python python_backend/scripts/sync_historical_daily.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSLMODE
        value: require
      - key: ODDS_API_KEY
        sync: false
      - key: API_SPORTS_KEY
        sync: false
      - key: SPORTMONKS_API_KEY
        sync: false
      - key: SPORTRADAR_API_KEY
        sync: false
      - key: SPORTRADAR_ACCESS_LEVEL
        value: trial
      - key: PIPELINE_ALERT_WEBHOOK_URL
        sync: false
      - key: HISTORICAL_MLB_LOOKBACK_DAYS
        value: 7

  - type: cron
    name: prop-intelligence-pregame-sync
    runtime: python
    schedule: "*/10 * * * *"
    buildCommand: pip install -r requirements.txt -r requirements-historical.txt
    startCommand: python python_backend/scripts/sync_pregame.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSLMODE
        value: require
      - key: ODDS_API_KEY
        sync: false
      - key: API_SPORTS_KEY
        sync: false
      - key: API_SPORTS_BASEBALL_KEY
        sync: false
      - key: SPORTSDATAIO_API_KEY
        sync: false
      - key: CRICKETDATA_API_KEY
        sync: false
      - key: SPORTMONKS_CRICKET_API_KEY
        sync: false
      - key: BALLDONTLIE_API_KEY
        sync: false
      - key: SPORTRADAR_WNBA_API_KEY
        sync: false
      - key: SPORTRADAR_API_KEY
        sync: false
      - key: SPORTRADAR_ACCESS_LEVEL
        value: trial
      - key: PIPELINE_ALERT_WEBHOOK_URL
        sync: false
      - key: API_BASE_URL
        value: https://api.propsintell.com

  - type: cron
    name: prop-intelligence-mlb-headshot-sync
