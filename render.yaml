    buildCommand: pip install -r requirements.txt
    startCommand: python python_backend/scripts/sync_espn_headshots.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: prop-intelligence-redis
          property: connectionString
