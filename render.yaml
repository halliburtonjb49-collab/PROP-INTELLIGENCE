services:
  - type: web
    name: prop-intelligence-api
    runtime: python
    # An always-on API avoids cold-start latency on the first prop request.
    plan: standard
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python python_backend/scripts/apply_supabase_migrations.py
    startCommand: uvicorn main:app --app-dir python_backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    maxShutdownDelaySeconds: 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSLMODE
        value: require
      - key: DATABASE_POOL_SIZE
        value: 5
      - key: SLOW_QUERY_MS
        value: 250
      - key: REDIS_URL
