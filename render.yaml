  - type: keyvalue
    name: prop-intelligence-redis
    # Keep the upgrade in source control so a Blueprint sync cannot return
    # this instance to Starter. The uncompressed catalog reached ~112 MiB and
    # the atomic rename holds the previous copy beside its replacement, which
    # exhausted the 256 MiB Starter instance and stopped publication outright.
    plan: standard
    # noeviction is deliberate: an LRU policy would silently evict the
    # catalog mid-publication and serve empty boards instead of failing
    # loudly enough to page someone.
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: worker
    name: prop-intelligence-worker
    runtime: python
    # Existing Render services retain their dashboard auto-deploy setting when
    # this field is omitted. Keep the worker on the same commit as the API so
    # a merged sync fix cannot leave an older RQ process running indefinitely.
    autoDeployTrigger: commit
    # Keep the dashboard upgrade in source control so a Blueprint sync cannot
    # silently return this memory-intensive worker to the 512 MB Starter plan.
    plan: standard
    buildCommand: pip install -r requirements.txt
    # Import the application before starting RQ so a missing provider or
    # database credential fails the deploy visibly. RQ otherwise reports the
    # worker live and waits until the first customer refresh job to import it.
    # SimpleWorker executes the sync in the worker process instead of forking
    # a second copy of the loaded catalog, which exceeded the 512 MB instance.
    startCommand: cd python_backend && python -c "import main" && exec rq worker -w rq.worker.SimpleWorker --url $REDIS_URL prop-intelligence
    maxShutdownDelaySeconds: 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: prop-intelligence-redis
          property: connectionString
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSLMODE
        value: require
      - key: ODDS_API_KEY
        sync: false
      - key: ODDS_API_KEY_SECONDARY
        sync: false
      - key: API_SPORTS_KEY
        sync: false
      - key: API_SPORTS_BASEBALL_KEY
        sync: false
      - key: SPORTSDATAIO_API_KEY
        sync: false
      - key: BALLDONTLIE_API_KEY
        sync: false
      - key: SPORTRADAR_WNBA_API_KEY
        sync: false
      - key: SPORTRADAR_API_KEY
        sync: false
      - key: SPORTRADAR_ACCESS_LEVEL
        value: trial
      - key: SPORTSGAMEODDS_API_KEY
        sync: false
      - key: SPORTSGAMEODDS_API_KEY_SECONDARY
        sync: false
      - key: SLIP_DATABASE_PATH
        value: /tmp/prop_intelligence_tickets.db
      - key: PROP_CACHE_DB_PATH
        value: /tmp/prop_intelligence_cache.db
      - key: PROP_SYNC_EVENT_WORKERS
        value: 3
      - key: PREGAME_PROVIDER_WORKERS
        value: 3
      - key: MLB_BOXSCORE_WORKERS
        value: 3
      - key: SPORTSGAMEODDS_LEAGUE_WORKERS
        value: 1
      - key: ODDS_FAST_REFRESH_SECONDS
        value: 120
      - key: ODDS_SUPPLEMENTAL_REFRESH_SECONDS
        value: 300
      - key: ODDS_COVERAGE_REFRESH_SECONDS
        value: 1800
      - key: SPORTSGAMEODDS_LEAGUES_PER_SYNC
        value: 3
      - key: SPORTSGAMEODDS_EVENTS_PER_LEAGUE
        value: 3
      - key: SPORTSGAMEODDS_DISABLED_LEAGUES
        value: ""
      # Render cron is the primary photo scheduler. The worker also checks this
      # threshold after prop syncs and queues a separate deduplicated refresh
      # if the cron was paused or missed.
      - key: ESPN_HEADSHOT_REFRESH_AFTER_HOURS
        value: 8
      - key: ESPN_HEADSHOT_REFRESH_BUCKET_HOURS
        value: 4
      - key: RAW_PROP_STREAM
