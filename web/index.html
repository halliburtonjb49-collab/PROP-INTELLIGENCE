<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="An all-in-one sports-prop intelligence ecosystem that helps users research, track, analyze, and discuss their picks without placing bets.">
  <meta name="theme-color" content="#D8B25C">
  <meta name="color-scheme" content="dark">
  <meta name="format-detection" content="telephone=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PROP INTEL">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
  <meta name="msapplication-TileColor" content="#07121B">
  <meta name="msapplication-TileImage" content="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>

  <title>PROP INTELLIGENCE</title>
  <!-- OneSignal Website SDK stable release 160608 (v16 loader). -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
          defer></script>
  <script src="onesignal-service.js" defer></script>
  <style>
    #onesignal-verification {
      position: fixed; inset: 0; z-index: 100000;
      display: grid; place-items: center;
      background: rgba(2, 8, 14, .78);
      font-family: Arial, sans-serif;
    }
    #onesignal-verification[hidden] { display: none; }
    #onesignal-verification-card {
      width: min(430px, calc(100vw - 32px));
      padding: 24px; border-radius: 14px;
      color: #fff; background: #0b1722;
      border: 1px solid #c89b2c;
      box-shadow: 0 20px 70px #000;
    }
    #onesignal-verification-card h2 { margin: 0 0 12px; font-size: 20px; }
    #onesignal-verification-card p { color: #c6d0d8; line-height: 1.45; }
    #onesignal-verification-button {
      float: right; padding: 10px 18px; border: 0; border-radius: 8px;
      background: #d4a62f; color: #07131f; font-weight: 800; cursor: pointer;
    }
  </style>
  <link rel="manifest" href="manifest.json?v=__PI_BUILD_VERSION__">
  <style>
    #pwa-install-card {
      position: fixed;
      z-index: 10000;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      display: none;
      align-items: center;
      gap: 10px;
      max-width: min(360px, calc(100vw - 32px));
      padding: 11px 12px;
      color: #f5f7fa;
      background: #08131d;
      border: 1px solid #ffc400;
      border-radius: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, .55);
      font: 700 13px/1.3 Arial, sans-serif;
    }
    #pwa-install-card button {
      min-height: 38px;
      padding: 0 13px;
      color: #06111b;
      background: #ffc400;
      border: 0;
      border-radius: 8px;
      font-weight: 900;
    }
    #pwa-install-dismiss {
      min-width: 34px;
      padding: 0 !important;
      color: #b7c2ce !important;
      background: transparent !important;
      font-size: 20px;
    }
    #pwa-update-card {
      position: fixed; z-index: 10001; left: 50%; bottom: max(88px, env(safe-area-inset-bottom));
      transform: translateX(-50%); display: none; align-items: center; gap: 12px;
      width: min(440px, calc(100vw - 32px)); box-sizing: border-box; padding: 12px 14px;
      border: 1px solid #d6b45f; border-radius: 14px; background: #07131d; color: #f7f1df;
      box-shadow: 0 12px 36px rgba(0,0,0,.42); font: 700 13px/1.35 Arial,sans-serif;
    }
    #pwa-update-card span { flex: 1; }
    #pwa-update-card button { min-height: 42px; padding: 0 14px; border: 0; border-radius: 9px; background: #d6b45f; color: #07131d; font-weight: 900; }
  </style>
</head>
<body>
  <script>
    (() => {
      if (!window.location.pathname.startsWith('/workspace')) return;
      const callback = new URLSearchParams(window.location.search).has('code') ||
        window.location.hash.includes('access_token=') ||
        window.location.search.includes('auth_action=recovery');
      if (callback) return;
      try {
        const raw = window.localStorage.getItem('sb-doncoxjilytojmnpukxi-auth-token');
        const session = raw ? JSON.parse(raw) : null;
        if (!session || !session.access_token) window.location.replace('/login');
      } catch (_) {
        window.location.replace('/login');
      }
    })();
  </script>
  <div id="onesignal-verification" hidden role="dialog" aria-modal="true"
       aria-labelledby="onesignal-verification-title">
    <div id="onesignal-verification-card">
      <h2 id="onesignal-verification-title">Enable notifications</h2>
      <p>Get live ticket updates, Prop Chat activity, and important account alerts.</p>
      <button id="onesignal-verification-button" type="button">Enable notifications</button>
    </div>
  </div>
  <aside id="pwa-install-card" role="dialog" aria-label="Install PROP INTELLIGENCE">
    <span id="pwa-install-message">Install PROP INTELLIGENCE on this device.</span>
    <button id="pwa-install-action" type="button">INSTALL</button>
    <button id="pwa-install-dismiss" type="button" aria-label="Dismiss install prompt">&times;</button>
  </aside>
  <aside id="pwa-update-card" role="status" aria-live="polite">
    <span>A fresh PROP INTELLIGENCE release is ready.</span>
    <button id="pwa-update-action" type="button">UPDATE NOW</button>
  </aside>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js?v=__PI_BUILD_VERSION__" async></script>
  <script src="pwa_install.js?v=__PI_BUILD_VERSION__" defer></script>
</body>
</html>
