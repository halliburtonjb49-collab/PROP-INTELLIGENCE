<body>
  <script>
    (() => {
      if (!window.location.pathname.startsWith('/workspace')) return;
      // An installed PWA is one application bundle; the saved presentation
      // preference controls the responsive viewport it opens with.
      const layoutMode = window.localStorage.getItem(
        'prop-intelligence-layout-mode',
      );
      const viewport = document.querySelector('meta[name="viewport"]');
      if (viewport && layoutMode === 'mobile') {
        viewport.setAttribute(
          'content',
          'width=390, initial-scale=1, maximum-scale=1, viewport-fit=cover',
        );
      } else if (viewport && layoutMode === 'tablet') {
        viewport.setAttribute(
          'content',
          'width=820, initial-scale=1, maximum-scale=1, viewport-fit=cover',
        );
      }
      const callback = new URLSearchParams(window.location.search).has('code') ||
        window.location.hash.includes('access_token=') ||
        window.location.search.includes('auth_action=recovery');
      if (callback) return;
      try {
        const raw = window.localStorage.getItem('sb-doncoxjilytojmnpukxi-auth-token');
        const session = raw ? JSON.parse(raw) : null;
        if (!session || !session.access_token) window.location.replace('/login');
      } catch (_) {
        window.location.replace('/login');
      }
    })();
  </script>
  <div id="pi-launch-shell" role="status" aria-live="polite">
    <div id="pi-launch-content">
      <img id="pi-launch-logo" src="icons/Icon-192.png" alt="">
      <h1 id="pi-launch-title">PROP INTELLIGENCE</h1>
      <p id="pi-launch-status">Loading today's live research...</p>

  <script>
    let piFirstFrameRendered = false;
    let piFlutterMountObserver = null;
    const revealFlutterWorkspace = () => {
      if (piFirstFrameRendered) return;
      piFirstFrameRendered = true;
      if (piFlutterMountObserver) piFlutterMountObserver.disconnect();
      const shell = document.getElementById('pi-launch-shell');
      if (!shell) return;
      shell.classList.add('is-ready');
      window.setTimeout(() => shell.remove(), 220);
    };
    const detectMountedFlutterWorkspace = () => {
      // Recent Flutter releases mount a <flutter-view>; older renderers use
      // <flt-glass-pane>. On iOS WebKit the Dart application can mount and
      // issue API requests before the browser delivers flutter-first-frame.
      // Detecting the real app host prevents the HTML splash from covering a
      // running login/dashboard and triggering destructive recovery reloads.
      if (!document.querySelector('flutter-view, flt-glass-pane')) return false;
      revealFlutterWorkspace();
      return true;
    };
    window.addEventListener('flutter-first-frame', revealFlutterWorkspace, {
      once: true,
    });
    piFlutterMountObserver = new MutationObserver(detectMountedFlutterWorkspace);
    piFlutterMountObserver.observe(document.documentElement, {
      childList: true,
      subtree: true,
    });

    // One production release briefly registered two workers for the same
    // scope. Recover affected browsers automatically instead of leaving a
    // customer on this launch screen indefinitely.
    window.setTimeout(async () => {
      if (piFirstFrameRendered || detectMountedFlutterWorkspace()) return;
      const status = document.getElementById('pi-launch-status');
      const currentUrl = new URL(window.location.href);
      const recoveryAttempt = Math.max(
        0,
        Number.parseInt(currentUrl.searchParams.get('recoveryAttempt') || '0', 10) || 0,
      );
      // Mobile Safari and Chrome can keep the former worker as controller for
      // one navigation after unregistering it. The old one-shot session flag
      // stopped here and required the customer to refresh manually. Allow a
      // bounded second clean navigation, with a unique URL, so the replacement
      // worker and release-addressed bootstrap can take control automatically.
      if (recoveryAttempt >= 2) {
        if (currentUrl.searchParams.get('recoveryFinal') === '1') {
          if (status) status.textContent = 'Unable to finish the update. Tap to retry.';
          const content = document.getElementById('pi-launch-content');
          if (content) {
            content.style.cursor = 'pointer';
            content.setAttribute('role', 'button');
            content.setAttribute('tabindex', '0');
            const retry = () => {
              const retryUrl = new URL(window.location.href);
              retryUrl.searchParams.delete('recoveryAttempt');
              retryUrl.searchParams.delete('recoveryFinal');
              retryUrl.searchParams.set('retry', Date.now().toString());
              window.location.replace(retryUrl.toString());
            };
            content.addEventListener('click', retry, { once: true });
            content.addEventListener('keydown', (event) => {
              if (event.key === 'Enter' || event.key === ' ') retry();
            }, { once: true });
          }
          return;
        }
        if (status) status.textContent = 'Retrying the live workspace...';
        window.setTimeout(() => {
          const retryUrl = new URL(window.location.href);
          retryUrl.searchParams.set('release', '__PI_BUILD_VERSION__');
          retryUrl.searchParams.set('recoveryFinal', '1');
          retryUrl.searchParams.set('retry', Date.now().toString());
          window.location.replace(retryUrl.toString());
        }, 1200);
        return;
      }
      if (status) status.textContent = 'Finishing the latest update...';
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) =>
            registration.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys
            .filter((key) => key.startsWith('flutter-'))
            .map((key) => caches.delete(key)));
        }
      } finally {
        const url = new URL(window.location.href);
        url.searchParams.set('release', '__PI_BUILD_VERSION__');
        url.searchParams.set('recoveryAttempt', String(recoveryAttempt + 1));
        url.searchParams.set('retry', Date.now().toString());
        window.location.replace(url.toString());
      }
    }, 20000);
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // A worker remains the controller until the next navigation even after it
    // is unregistered. When the HTML release changes, clear the old app shell
    // and perform exactly one release-addressed navigation before Flutter is
    // allowed to start. This prevents a new index from launching an old
    // main.dart.js on Safari/Chrome mobile.
    (async () => {
      const release = '__PI_BUILD_VERSION__';
      const releaseKey = 'pi-active-web-release';
      const previous = window.localStorage.getItem(releaseKey);
      if (previous !== release && !window.location.search.includes(`release=${release}`)) {
        window.localStorage.setItem(releaseKey, release);
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys
              .filter((key) => key.startsWith('pi-app-shell-') || key.startsWith('flutter-'))
              .map((key) => caches.delete(key)));
          }
        } finally {
          const url = new URL(window.location.href);
          url.searchParams.set('release', release);
          window.location.replace(url.toString());
        }
        return;
      }
      window.localStorage.setItem(releaseKey, release);
      const bootstrap = document.createElement('script');
      bootstrap.src = `flutter_bootstrap.js?v=${release}`;
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    })();
  </script>
  <script src="pwa_install.js?v=__PI_BUILD_VERSION__" defer></script>
