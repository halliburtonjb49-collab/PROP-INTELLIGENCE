name: Production smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Require deployed commit only for Render changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          render_changes="$(
            git diff --name-only HEAD^ HEAD |
              grep -E '^(python_backend/|render\.yaml$|requirements.*\.txt$|supabase.*\.sql$|\.render-deploy-trigger$)' |
              grep -Ev '^python_backend/tests/' || true
          )"
          if [[ -z "$render_changes" ]]; then
            echo "EXPECTED_PRODUCTION_VERSION=" >> "$GITHUB_ENV"
          else
            echo "EXPECTED_PRODUCTION_VERSION=$GITHUB_SHA" >> "$GITHUB_ENV"
          fi
      - name: Verify app, CORS, props, payload, and production bundle
        id: production-check
        env:
          SMOKE_API_TOKEN: ${{ secrets.SMOKE_API_TOKEN }}
          PRODUCTION_DEPLOY_WAIT_SECONDS: "600"
          PRODUCTION_FEED_WARMUP_SECONDS: "300"
        run: python tools/post_deploy_smoke.py
      - name: Alert owner when deployment or service health fails
        if: failure()
        env:
          OPERATIONS_ALERT_WEBHOOK_URL: ${{ secrets.OPERATIONS_ALERT_WEBHOOK_URL }}
          OPERATIONS_ALERT_EVENT: production-deployment-or-health-failed
          OPERATIONS_ALERT_DETAILS: Production smoke or readiness verification failed.
        run: python tools/send_operations_alert.py
