name: Bootstrap mobile prop fix
on:
  push:
    paths:
      - '.github/workflows/bootstrap-mobile-prop-fix.yml'
permissions:
  contents: write
jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply tested mobile prop fix
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/mobile-prop-fix.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am /tmp/mobile-prop-fix.patch
          git rm .github/workflows/bootstrap-mobile-prop-fix.yml
          git commit -m "remove temporary prop fix bootstrap"
          git push origin HEAD:main
