name: Build Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Validate Android release secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REVENUECAT_ANDROID_PUBLIC_API_KEY: ${{ secrets.REVENUECAT_ANDROID_PUBLIC_API_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          for name in SUPABASE_URL SUPABASE_ANON_KEY REVENUECAT_ANDROID_PUBLIC_API_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for a distributable Android release."
              exit 1
            fi
          done
      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
      - name: Install dependencies
        run: flutter pub get
      - name: Build signed APK and app bundle
        env:
          ANDROID_KEYSTORE_PATH: upload-keystore.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REVENUECAT_ANDROID_PUBLIC_API_KEY: ${{ secrets.REVENUECAT_ANDROID_PUBLIC_API_KEY }}
        run: |
          DEFINES=(
            "--dart-define=API_BASE_URL=https://api.propsintell.com"
            "--dart-define=SUPABASE_URL=$SUPABASE_URL"
            "--dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            "--dart-define=REVENUECAT_ANDROID_PUBLIC_API_KEY=$REVENUECAT_ANDROID_PUBLIC_API_KEY"
            "--dart-define=AUTH_EMAIL_REDIRECT_URL=com.propintelligence.app://login-callback/"
            "--dart-define=ALLOW_PUBLIC_SIGNUP=false"
          )
          flutter build apk --release "${DEFINES[@]}"
          flutter build appbundle --release "${DEFINES[@]}"
      - uses: actions/upload-artifact@v6
        with:
          name: prop-intelligence-android-1.0.1
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
