# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Strikeout Quality Monitor

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

jobs:
  monitor-strikeout-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python_backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
      - name: Run strikeout quality monitor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STRIKEOUT_MONITOR_FAIL_ON_ALERT: 'true'
        run: |
          PYTHONPATH=. python scripts/strikeout_quality_monitor.py
