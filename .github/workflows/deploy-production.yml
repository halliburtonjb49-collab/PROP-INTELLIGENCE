# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-production-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Confirm automatic deployment
        run: echo "Main was updated; waiting for the production services to deploy."
      - name: Require the exact deployed commit
        run: echo "EXPECTED_PRODUCTION_VERSION=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Run blocking production smoke tests
        env:
          PRODUCTION_DEPLOY_WAIT_SECONDS: "900"
          PRODUCTION_FEED_WARMUP_SECONDS: "300"
          SMOKE_API_TOKEN: ${{ secrets.SMOKE_API_TOKEN }}
        run: python tools/post_deploy_smoke.py
      - name: Deployment summary
        run: echo "Production deployment passed all smoke checks."
