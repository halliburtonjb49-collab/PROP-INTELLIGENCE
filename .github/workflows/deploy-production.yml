# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-production-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Confirm automatic deployment
        run: echo "Main was updated; waiting for the production services to deploy."
      - name: Require deployed commit only for Render changes
        shell: bash
        run: |
          render_changes="$(
            git diff --name-only HEAD^ HEAD |
              grep -E '^(python_backend/|render\.yaml$|requirements.*\.txt$|supabase.*\.sql$|\.render-deploy-trigger$)' |
              grep -Ev '^python_backend/tests/' || true
          )"
          if [[ -z "$render_changes" ]]; then
            echo "EXPECTED_PRODUCTION_VERSION=" >> "$GITHUB_ENV"
          else
            echo "EXPECTED_PRODUCTION_VERSION=$GITHUB_SHA" >> "$GITHUB_ENV"
          fi
      # This must run before the smoke check, not after. Waiting ten minutes
      # for a deployment that has not been requested yet fails the job at the
      # wait step, so the trigger below never runs and the drift never heals.
      # It is unconditional so that a service which has fallen behind main
      # catches up on the next push rather than staying behind indefinitely.
      - name: Trigger Render deployment
        run: |
          RENDER_DEPLOY_HOOK_URL="${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured; skipping Render deployment trigger."
            exit 0
          fi
          echo "Triggering Render deployment for main..."
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
      - name: Run blocking production smoke tests
        env:
          PRODUCTION_DEPLOY_WAIT_SECONDS: "900"
          PRODUCTION_FEED_WARMUP_SECONDS: "300"
        run: python tools/post_deploy_smoke.py
      - name: Deployment summary
        run: echo "Production deployment passed all smoke checks."
